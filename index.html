<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy 10th Anniversary</title>
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      img,
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      #startButton {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 20px 40px;
        font-size: 20px;
        background: gold;
        border: none;
        cursor: pointer;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <button id="startButton">Play Anniversary Surprise</button>

    <div id="content" style="display: none;">
      <img src="img/wish.png" alt="wish" />
      <img src="img/img1.png" alt="Image 1" />
      <video id="video" loop>
        <source src="img/vedio.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
      <img src="img/img2.png" alt="Image 2" />
    </div>

    <script>
      const button = document.getElementById("startButton");
      const content = document.getElementById("content");
      const video = document.getElementById("video");

      button.addEventListener("click", () => {
        button.style.display = "none";
        content.style.display = "block";
        video.play();
      });
    </script>
  </body>
</html>
